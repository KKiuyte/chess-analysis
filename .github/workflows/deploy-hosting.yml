# Met l'appli en ligne (Firebase Hosting, https://analyse-echecs.web.app) dès qu'un changement de
# l'interface arrive sur main : app/public/index.html, templates/, firebase.json.
# Même commande que sur la VM (« firebase deploy --only hosting »), prédéploiement de firebase.json compris.
# Compte de service : rôles « Administrateur Firebase Hosting » et « Lecteur de clés API » (voir README).
name: Mise en ligne de l'appli

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "templates/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-hosting.yml"
  workflow_dispatch:      # bouton « Run workflow » : remettre en ligne sans nouveau commit

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    name: Firebase Hosting
    if: github.ref == 'refs/heads/main'       # seule main part en production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cle
        with:
          key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANALYSE_ECHECS }}
      - name: Déployer
        run: npx --yes firebase-tools@latest deploy --only hosting --project analyse-echecs --non-interactive
