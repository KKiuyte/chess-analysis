<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : échiquier puis panneau sur mobile, côte à côte au-delà de 860px. */
:root {
  --bg: #f4f5f1; --surface: #fcfcfa; --fg: #171a17; --muted: #586058; --faint: #8a918a;
  --line: #dde1d9; --accent: #3b6a44; --accent-soft: #e3ece2;
  --ok: #0c8a0c; --ok-soft: #e1f1df; --bad: #c43535; --bad-soft: #f8e3e1; --warn: #a86c00;
  --sq-light: #ebecd0; --sq-dark: #739552;
  --hl-last: rgba(246, 222, 70, .55); --hl-sel: rgba(42, 120, 214, .45); --hl-bad: rgba(208, 59, 59, .55);
  --hl-best: rgba(42, 120, 214, .5); --dot: rgba(20, 30, 20, .32);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1a1d1b; --fg: #edefeb; --muted: #a4aca5; --faint: #747c75;
    --line: #2b312d; --accent: #86b98e; --accent-soft: #223026;
    --ok: #5cc95c; --ok-soft: #1c3020; --bad: #ec6b6b; --bad-soft: #3a1f1f; --warn: #e0a640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1a1d1b; --fg: #edefeb; --muted: #a4aca5; --faint: #747c75;
  --line: #2b312d; --accent: #86b98e; --accent-soft: #223026;
  --ok: #5cc95c; --ok-soft: #1c3020; --bad: #ec6b6b; --bad-soft: #3a1f1f; --warn: #e0a640;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 22px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-top: 28px; flex-wrap: wrap; }
.top .meta { color: var(--muted); max-width: 62ch; margin-top: 8px; }
.theme-btn { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }

/* Progression */
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.progress .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.progress .big { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
.bar span { display: block; height: 100%; }
.bar .ok { background: var(--ok); } .bar .ko { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.sync { font-size: 13px; color: var(--muted); }
.sync.warn { color: var(--warn); }

/* Filtres */
.filters summary { display: none; }
.fbody { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--fg); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 700; }

/* Exercice */
.ex { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 860px) { .ex { grid-template-columns: minmax(0, 540px) minmax(0, 1fr); } }
.board-wrap { position: relative; width: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); aspect-ratio: 1; width: 100%; border-radius: 6px; overflow: hidden; container-type: inline-size; touch-action: manipulation; }
.board button { all: unset; position: relative; aspect-ratio: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 10.5cqi; line-height: 1; user-select: none; -webkit-tap-highlight-color: transparent; cursor: default; }
.board button.can { cursor: pointer; }
.board .l { background: var(--sq-light); } .board .d { background: var(--sq-dark); }
.board button::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.board .last::after { background: var(--hl-last); }
.board .sel::after { background: var(--hl-sel); }
.board .bad::after { background: var(--hl-bad); }
.board .best::after { background: var(--hl-best); }
.board .check::after { background: radial-gradient(circle, rgba(220, 40, 40, .9) 0%, rgba(220, 40, 40, .5) 45%, transparent 75%); }
.board .flash::after { background: var(--hl-bad); animation: flash .45s ease-in-out 3 alternate; }
@keyframes flash { from { opacity: 1; } to { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .board .flash::after { animation: none; } }
.board .hint::after { box-shadow: inset 0 0 0 4px var(--hl-best); }
.board .dest::before { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); z-index: 2; pointer-events: none; }
.board .dest.cap::before { width: 86%; height: 86%; background: none; box-shadow: inset 0 0 0 5px var(--dot); }
.board .pc { position: relative; z-index: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", sans-serif; pointer-events: none; }
.board .pw { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 1px 1px #000; }
.board .pb { color: #111; text-shadow: 0 0 1px #fff8; }
.board .co { position: absolute; font-size: 2.4cqi; font-weight: 700; font-family: var(--f-body); pointer-events: none; z-index: 1; }
.board .co.f { right: 6%; bottom: 3%; } .board .co.r { left: 6%; top: 3%; }
.board .l .co { color: var(--sq-dark); } .board .d .co { color: var(--sq-light); }
.promo { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.promo button { font: inherit; font-size: 28px; line-height: 1; width: 48px; height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", sans-serif; }
.under { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.panel { display: flex; flex-direction: column; gap: 14px; }
.ex-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
/* Verdict posé sur l'échiquier : visible sans faire défiler. */
.verdict { position: absolute; top: -14px; right: -14px; z-index: 5; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 700; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3); pointer-events: none; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.verdict.ok { background: var(--ok); } .verdict.ko { background: var(--bad); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .verdict { animation: none; } }
.panel .theme { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; }
.turn { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.turn .sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--faint); flex: none; }
.nudge { font-size: 14px; font-weight: 700; color: var(--bad); }
.ctx { color: var(--muted); font-size: 14px; }
.state { font-size: 13px; color: var(--muted); }
.fb { border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); background: var(--surface); }
.fb.ok { background: var(--ok-soft); border-color: transparent; }
.fb.ko { background: var(--bad-soft); border-color: transparent; }
.fb .v { font-weight: 700; font-size: 16px; }
.fb.ok .v { color: var(--ok); } .fb.ko .v { color: var(--bad); }
.fb dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 4px 0 0; font-size: 14px; }
.fb dt { color: var(--muted); } .fb dd { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-size: 15px; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
.btn[disabled] { opacity: .45; cursor: default; }
.links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 16px; text-align: center; color: var(--muted); }
/* Mobile : l'échiquier d'abord, le verdict dessous, les boutons toujours à portée du pouce. */
@media (max-width: 859px) {
  .wrap { gap: 14px; }
  .top { padding-top: 14px; align-items: center; flex-wrap: nowrap; }
  .top .eyebrow, .top .meta { display: none; }
  h1 { font-size: 22px; }
  .theme-btn { flex: none; padding: 4px 10px; font-size: 12px; }
  .progress { padding: 10px 12px; gap: 6px; }
  .progress .big { font-size: 18px; }
  .progress .head { font-size: 13px; gap: 2px 12px; }
  #pDoneLbl { white-space: nowrap; }
  .sync:not(.warn), .legend { display: none; }
  .sync { font-size: 12px; }
  .filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .filters summary { display: flex; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; list-style: none; font-size: 14px; min-height: 44px; }
  .filters summary::-webkit-details-marker { display: none; }
  .filters summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .2s; }
  .filters[open] summary::after { transform: rotate(180deg); }
  .flbl { font-weight: 700; }
  .fsum { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .fbody { padding: 0 12px 12px; gap: 8px; }
  .seg button { padding: 8px 12px; }
  .ex { gap: 10px; }
  .panel { display: contents; }
  .ex-head { order: 1; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 6px 10px; scroll-margin-top: 8px; }
  .turn { font-size: 15px; }
  .board-wrap { order: 2; }
  .nudge { order: 3; }
  .fb { order: 4; scroll-margin-bottom: 84px; }
  .state { order: 5; } .ctx { order: 6; } .links { order: 7; }
  .actions { order: 9; position: sticky; bottom: 0; z-index: 20; flex-wrap: nowrap; margin: 0 -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); box-shadow: 0 -6px 16px rgba(0,0,0,.06); }
  .actions .btn { flex: 1 1 0; min-width: 0; padding: 8px 6px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions .btn[disabled] { display: none; }
  .verdict { width: 40px; height: 40px; font-size: 22px; top: -10px; right: -8px; }
}
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Exercices tirés de tes parties</div>
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">Thème : auto</button>
  </header>

  <section class="progress" aria-label="Progression">
    <div class="head">
      <div><span class="big" id="pDone"></span> <span class="muted" id="pDoneLbl"></span></div>
      <div class="sync" id="sync">Chargement de ta progression…</div>
    </div>
    <div class="bar" id="pBar"></div>
    <div class="legend" id="pLegend"></div>
  </section>

  <details class="filters" id="filters" open>
    <summary><span class="flbl">Filtres</span><span class="fsum" id="fSum"></span></summary>
    <div class="fbody">
      <div class="seg" id="fTheme" role="group" aria-label="Thème"></div>
      <div class="seg" id="fTc" role="group" aria-label="Cadence"></div>
      <div class="seg" id="fStatus" role="group" aria-label="Statut"></div>
    </div>
  </details>

  <section class="ex" id="ex">
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Échiquier"></div>
      <div class="verdict" id="verdict" aria-hidden="true" hidden></div>
      <div class="promo" id="promo" hidden></div>
      <div class="under"><span id="counter" class="num"></span><span id="orient"></span></div>
    </div>
    <div class="panel">
      <div class="ex-head">
        <span class="theme" id="theme"></span>
        <div class="turn"><span class="sw" id="sw"></span><span id="turnTxt"></span></div>
      </div>
      <p class="nudge" id="nudge" role="status" aria-live="polite" hidden></p>
      <p class="ctx" id="ctx"></p>
      <p class="state" id="state"></p>
      <div class="fb" id="fb" hidden></div>
      <div class="actions">
        <button class="btn" id="bHint" type="button">Indice</button>
        <button class="btn" id="bSol" type="button">Solution</button>
        <button class="btn" id="bRetry" type="button" hidden>Réessayer</button>
        <button class="btn" id="bErr" type="button" hidden>Voir mon erreur</button>
        <button class="btn primary" id="bNext" type="button">Suivant</button>
      </div>
      <div class="links" id="links" hidden></div>
    </div>
  </section>
  <div class="empty" id="empty" hidden></div>

  <footer id="foot"></footer>
</div>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => `${Math.round(x)} %`;
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const dateLabel = d => { const [y, m, j] = d.split("-"); return `${+j} ${MOIS[+m - 1]} ${y}`; };
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const FILES = "abcdefgh";

// ---------- En-tête ----------
$("title").textContent = `${D.player} · Exercices`;
document.title = `Exercices ${D.player}`;
const sinceD = new Date(D.since);
$("meta").textContent = `${D.items.length} positions où tu as fait une erreur ou une gaffe depuis ${MOIS[sinceD.getMonth()]} ${sinceD.getFullYear()}. `
  + `Rejoue-les : touche une pièce puis sa case d'arrivée. Tous les coups ont été évalués par Stockfish 19 (profondeur ${D.depth}).`;
if (D.more) $("meta").textContent += " D'autres exercices sont en préparation : ils apparaîtront dans une minute environ, quand tu reviendras sur cet onglet.";
$("foot").textContent = `Un coup est accepté s'il perd moins de ${D.tolerance} points de % de gain par rapport au meilleur coup ; `
  + `pour « ${D.themes.mate} », il faut un mat aussi rapide (un coup de plus toléré à partir du mat en 3). Pour un mat en plusieurs coups, l'adversaire répond par sa meilleure défense et tu continues jusqu'au mat. Exercice réussi = sans aucune erreur, indice ni solution. `
  + `Données du ${D.generated.replace(" ", " à ")}, issues de l'API publique chess.com (site non affilié à chess.com).`;

// ---------- Thème ----------
const THEMES = ["auto", "clair", "sombre"];
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
function applyTheme() {
  const r = document.documentElement;
  if (theme === "clair") r.setAttribute("data-theme", "light");
  else if (theme === "sombre") r.setAttribute("data-theme", "dark");
  else r.removeAttribute("data-theme");
  $("themeBtn").textContent = "Thème : " + theme;
}
$("themeBtn").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem("theme", theme); } catch (e) {}
  applyTheme();
});
if (theme !== "auto") applyTheme();

// ---------- Progression : db du viewer, copie locale en secours ----------
// progress[id] = { s: "ok" | "ko", a: nombre de tentatives, t: date ISO }
const LS_KEY = "exercises-progress";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) {}
let remote = null, writing = false, dirty = false;

function setSync(txt, warn) { $("sync").textContent = txt; $("sync").classList.toggle("warn", !!warn); }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {} }

let retryT = null;
async function flush() {
  if (!remote || writing || !dirty) return;
  writing = true; dirty = false;
  let failed = false;
  try {
    await remote.set({ p: progress, v: 1 });
    setSync("Progression synchronisée en ligne");
  } catch (e) {
    failed = true;
    if (e && ["invalid_argument", "invalid-argument", "permission-denied", "not_granted", "revoked"].includes(e.code)) {
      remote = null;
      setSync("Ta progression est gardée sur cet appareil seulement (pas d'accès en écriture à cette page).", true);
    } else {
      dirty = true;
      setSync("Synchronisation impossible pour l'instant, nouvel essai au prochain exercice.", true);
    }
  } finally { writing = false; }
  // Coups joués pendant l'écriture : on enchaîne. Après une erreur : nouvel essai dans 5 s,
  // jamais en boucle immédiate (une erreur synchrone gelait la page).
  if (dirty && remote && !failed) flush();
  else if (dirty && remote && !retryT) retryT = setTimeout(() => { retryT = null; flush(); }, 5000);
}
function record(id, ok) {
  const cur = progress[id] || { a: 0 };
  progress[id] = { s: ok ? "ok" : "ko", a: cur.a + 1, t: new Date().toISOString().slice(0, 10) };
  saveLocal(); dirty = true; setTimeout(flush, 0); renderProgress();
}

// Document de progression : celui du compte Google dans l'appli Firebase (page affichée
// dans son iframe), sinon celui du viewer sur claude.ai.
async function progressRef() {
  let host = null;
  try { host = window.parent !== window ? window.parent.chessApp : null; } catch (e) {}
  if (host?.progressDoc) return host.progressDoc();
  if (!window.claude?.use) return null;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  const uid = user ? await user.id() : null;
  return db && uid ? db.doc(`data/users/${uid}/progress`) : null;
}

(async () => {
  const ref = await progressRef();
  if (!ref) { setSync("Progression gardée sur cet appareil seulement.", true); return; }
  let first = true;
  ref.onSnapshot(snap => {
    const p = (snap.exists && snap.data()?.p) || {};
    if (first) {
      first = false;
      remote = ref;
      // Premier chargement : on fusionne ce qui n'était que sur cet appareil.
      const localOnly = Object.keys(progress).filter(k => !(k in p));
      progress = { ...progress, ...p };
      setSync("Progression synchronisée en ligne");
      if (localOnly.length) { dirty = true; flush(); }
    } else if (!writing) {
      progress = { ...progress, ...p };
    }
    saveLocal(); renderProgress(); if (first === false && !cur.done) renderState();
  }, err => {
    remote = null;
    setSync("Progression gardée sur cet appareil seulement.", true);
  });
})();

// ---------- Filtres ----------
const tcs = [...new Set(D.items.map(x => x.tc))];
const filt = { th: "all", tc: "all", st: "todo" };
// Filtre de départ (bouton « S'entraîner » d'un bilan) : transmis par l'appli, ou dans l'adresse #th=…&tc=…
(() => {
  let f = null;
  try { f = window.parent !== window ? window.parent.chessApp?.takeExerciseFilter?.() : null; } catch (e) {}
  if (!f && location.hash.includes("th=")) f = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if (f?.th && (f.th === "all" || f.th in D.themes)) filt.th = f.th;
  if (f?.tc && tcs.includes(f.tc)) filt.tc = f.tc;
})();
function seg(el, key, opts) {
  $(el).innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${filt[key] === v}">${esc(l)}</button>`).join("");
  $(el).onclick = e => {
    const b = e.target.closest("button"); if (!b) return;

seg("fTheme", "th", [["all", "Tous les thèmes"], ...Object.entries(D.themes)]);

// ---------- Position ----------
// pos : tableau de 64 cases (0 = a1), lettres FEN ou null.
function parseFen(fen) {
  const pos = Array(64).fill(null);
  fen.split(" ")[0].split("/").forEach((row, i) => {
    let f = 0;
    for (const ch of row) { if (/\d/.test(ch)) f += +ch; else pos[(7 - i) * 8 + f++] = ch; }
  });

}
const sqIdx = s => FILES.indexOf(s[0]) + (s[1] - 1) * 8;
const sqName = i => FILES[i % 8] + (Math.floor(i / 8) + 1);
function applyUci(pos, uci) {
  const p = pos.slice(), from = sqIdx(uci.slice(0, 2)), to = sqIdx(uci.slice(2, 4)), pc = p[from];
  const white = pc === pc.toUpperCase();
  if (pc.toLowerCase() === "k" && Math.abs(to - from) === 2) {
    const [rf, rt] = to > from ? [from + 3, from + 1] : [from - 4, from - 1];
    p[rt] = p[rf]; p[rf] = null;
  }
  if (pc.toLowerCase() === "p" && (to - from) % 8 !== 0 && !p[to]) p[to + (white ? -8 : 8)] = null;
  p[to] = uci[4] ? (white ? uci[4].toUpperCase() : uci[4]) : pc;
  p[from] = null;
  return p;
}

// ---------- Exercice courant ----------
let order = [], idx = -1;
let cur = {};   // { x, pos, sel, last, marks, done, tried, assisted, locked }

function goFirst() {
  order = D.items.filter(x => inFilter(x));

}
function load(i) {
  $("promo").hidden = true;

      : filt.st === "todo" ? "Tous les exercices de cette sélection sont faits. Passe sur « À revoir » pour retravailler tes ratés."

  const root = { mv: x.mv, b: x.b, nx: x.nx, chk: x.chk };

          pos: parseFen(x.fen), sel: null, last: null, marks: {}, done: false, tried: false, assisted: false, locked: false };
  const white = x.c === "w", g = D.themes[x.th];

  $("verdict").hidden = true;

  $("turnTxt").textContent = `Tu as les ${white ? "blancs" : "noirs"}, ` + (x.chk ? "ton roi est en échec" : "à toi de jouer");
  $("ctx").textContent = `Coup ${x.n} contre ${x.o} (${x.oe}), ${dateLabel(x.d)} · ${D.tcLabels[x.tc]}. `

function renderState() {

function legalFrom(sq) { return cur.node.mv.filter(m => m[0].slice(0, 2) === sq); }
function drawBoard() {
  const x = cur.x, flip = x.c === "b";
  const dests = cur.sel ? legalFrom(cur.sel).map(m => m[0].slice(2, 4)) : [];
  const cells = [];
  for (let r = 7; r >= 0; r--) for (let f = 0; f < 8; f++) cells.push(r * 8 + f);
  if (flip) cells.reverse();
  const mine = ch => ch && (ch === ch.toUpperCase()) === (x.c === "w");
  const html = cells.map((i, k) => {
    const n = sqName(i), pc = cur.pos[i];
    const cls = [(Math.floor(i / 8) + i % 8) % 2 ? "l" : "d"];
    if (cur.marks[n]) cls.push(cur.marks[n]);
    else if (cur.last && cur.last.includes(n)) cls.push("last");
    if (cur.sel === n) cls.push("sel");
    if (cur.node.chk && cur.fresh && !cur.done && pc === (x.c === "w" ? "K" : "k")) cls.push("check");
    if (cur.flash === n) cls.push("flash");
    if (dests.includes(n)) cls.push("dest", ...(pc ? ["cap"] : []));
    const can = !cur.locked && !cur.done && (mine(pc) || dests.includes(n));
    if (can) cls.push("can");
    const glyph = pc ? `<span class="pc ${pc === pc.toUpperCase() ? "pw" : "pb"}">${GLYPH[pc.toLowerCase()]}︎</span>` : "";
    const co = (k % 8 === 0 ? `<span class="co r">${n[1]}</span>` : "") + (k >= 56 ? `<span class="co f">${n[0]}</span>` : "");
    const label = pc ? `${n}, ${pc === pc.toUpperCase() ? "blanc" : "noir"} ${{ k: "roi", q: "dame", r: "tour", b: "fou", n: "cavalier", p: "pion" }[pc.toLowerCase()]}` : n;
    return [n, cls.join(" "), label, co + glyph];
  });

  const B = $("board"), key = cells.join();
  if (B.dataset.cells !== key) {
    B.dataset.cells = key;
    B.innerHTML = html.map(([n]) => `<button type="button" data-sq="${n}"></button>`).join("");
  }
  html.forEach(([, cls, label, inner], k) => {
    const el = B.children[k];
    if (el.className !== cls) el.className = cls;
    if (el.__inner !== inner) { el.innerHTML = inner; el.__inner = inner; el.setAttribute("aria-label", label); }

}

// Réaction dès que le doigt (ou la souris) touche la case : le « click » arrive plus tard sur mobile.

function tapSquare(e) {

  const n = b.dataset.sq, pc = cur.pos[sqIdx(n)];
  const mine = pc && (pc === pc.toUpperCase()) === (cur.x.c === "w");
  if (cur.sel) {
    const cands = legalFrom(cur.sel).filter(m => m[0].slice(2, 4) === n);
    if (cands.length === 1) return play(cands[0]);
    if (cands.length > 1) return askPromo(cands);
  }

}

// Pièce sans coup légal : on dit pourquoi au lieu de ne rien faire.

  nudge(!inCheck ? "Cette pièce ne peut pas bouger : elle est clouée ou bloquée."

function nudge(t) { $("nudge").textContent = t; $("nudge").hidden = false; }

function askPromo(cands) {
  const white = cur.x.c === "w";
  $("promo").innerHTML = `<span>Promotion :</span>` + ["q", "r", "b", "n"].map(p => {
    const m = cands.find(c => c[0][4] === p);

    + `Continue : il reste un mat en ${left}.</p>`;

      if (m[0] !== b[0]) lines.push(["Meilleur coup", `<span class="mono">${esc(b[1])}</span> · ${pct(b[2])}`]);

  let nextX = null;
  for (let k = 1; k <= sel.length && !nextX; k++) {
    const c = sel[(at + k) % sel.length];
    if (c.id !== curId && inFilter(c)) nextX = c;
  }
  order = D.items.filter(x => inFilter(x) && (x.id !== curId || !nextX));
  load(nextX ? order.indexOf(nextX) : 0);
  reveal(document.querySelector(".ex-head"), "start");
});

goFirst();
</script>
