<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Un exercice = un écran, sans défilement : barre (progression, filtres), consigne, échiquier dimensionné
   à la place disponible, verdict, boutons. Écran en hauteur : tout empilé, boutons en bas.
   Écran en largeur : échiquier à gauche, panneau à droite. */
:root {
  --bg: #f4f5f1; --surface: #fcfcfa; --fg: #171a17; --muted: #586058; --faint: #8a918a;
  --line: #dde1d9; --accent: #3b6a44; --accent-soft: #e3ece2;
  --ok: #0c8a0c; --ok-soft: #e1f1df; --bad: #c43535; --bad-soft: #f8e3e1; --warn: #a86c00;
  --sq-light: #ebecd0; --sq-dark: #739552;
  --hl-last: rgba(246, 222, 70, .55); --hl-sel: rgba(42, 120, 214, .45); --hl-bad: rgba(208, 59, 59, .55);
  --hl-best: rgba(42, 120, 214, .5); --dot: rgba(20, 30, 20, .32);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1a1d1b; --fg: #edefeb; --muted: #a4aca5; --faint: #747c75;
    --line: #2b312d; --accent: #86b98e; --accent-soft: #223026;
    --ok: #5cc95c; --ok-soft: #1c3020; --bad: #ec6b6b; --bad-soft: #3a1f1f; --warn: #e0a640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1a1d1b; --fg: #edefeb; --muted: #a4aca5; --faint: #747c75;
  --line: #2b312d; --accent: #86b98e; --accent-soft: #223026;
  --ok: #5cc95c; --ok-soft: #1c3020; --bad: #ec6b6b; --bad-soft: #3a1f1f; --warn: #e0a640;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
h1, h2 { font-family: var(--f-display); margin: 0; line-height: 1.15; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

.app { height: 100vh; height: 100dvh; max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
/* Titre : seulement hors de l'appli (page autonome), où aucun onglet ne nomme la page. */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 10px; }
.top h1 { font-size: 20px; }
.in-app .top { display: none; }
.pill { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }

/* Barre : progression à gauche, filtres et aide à droite */
.bar { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 0; width: 100%; max-width: 640px; align-self: center; }
.prog { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.prog b { font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog .lbl { font-size: 13px; color: var(--muted); white-space: nowrap; }
.pbar { flex: 1; min-width: 24px; max-width: 320px; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
.pbar span { display: block; height: 100%; }
.pbar .ok { background: var(--ok); } .pbar .ko { background: var(--bad); }
.filters summary { list-style: none; display: flex; align-items: center; gap: 6px; max-width: 58vw; }
.filters summary::-webkit-details-marker { display: none; }
.filters summary::after { content: "▾"; color: var(--muted); }
.filters[open] summary { border-color: var(--accent); }
.fsum { overflow: hidden; text-overflow: ellipsis; }
.fbody { position: absolute; right: 0; top: calc(100% - 2px); z-index: 30; width: min(460px, 100%); max-height: calc(100dvh - 70px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column; gap: 12px; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg); padding: 7px 12px; cursor: pointer; min-height: 36px; }
.seg button i { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
.seg button[aria-pressed="true"] i { color: inherit; opacity: .8; }
.sync { font-size: 12px; color: var(--warn); padding-bottom: 6px; }

/* Scène : la place restante. Son format (cqw, cqh) fixe la taille de l'échiquier. */
.stage { flex: 1; min-height: 0; container-type: size; display: flex; flex-direction: column; gap: 8px;
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  /* consigne + verdict (au moins) + boutons + espacements */
  --b: max(200px, min(100cqw, 640px, 100cqh - 190px)); }
.panel { display: contents; }
/* Tablette tenue en hauteur : tout reste aligné sur la largeur de l'échiquier. */
.ex-head, .scroll, .actions { width: 100%; max-width: 640px; align-self: center; }
.ex-head { order: 1; display: flex; align-items: center; gap: 8px; min-height: 26px; }
.sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--faint); flex: none; }
.ttl { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.ttl b { font-family: var(--f-display); font-size: 17px; line-height: 1.2; }
.ttl span { font-size: 14px; color: var(--muted); }
.counter { font-size: 13px; color: var(--muted); white-space: nowrap; }
.board-col { order: 2; align-self: center; position: relative; width: var(--b); flex: none; }
.board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); aspect-ratio: 1; width: 100%; border-radius: 6px; overflow: hidden; container-type: inline-size; touch-action: manipulation; }
.board button { all: unset; position: relative; aspect-ratio: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 10.5cqi; line-height: 1; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: default; }
.board button.can { cursor: pointer; }
.board .l { background: var(--sq-light); } .board .d { background: var(--sq-dark); }
.board button::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.board .last::after { background: var(--hl-last); }
.board .sel::after { background: var(--hl-sel); }
.board .bad::after { background: var(--hl-bad); }
.board .best::after { background: var(--hl-best); }
.board .check::after { background: radial-gradient(circle, rgba(220, 40, 40, .9) 0%, rgba(220, 40, 40, .5) 45%, transparent 75%); }
.board .flash::after { background: var(--hl-bad); animation: flash .45s ease-in-out 3 alternate; }
@keyframes flash { from { opacity: 1; } to { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .board .flash::after { animation: none; } }
.board .hint::after { box-shadow: inset 0 0 0 4px var(--hl-best); }
.board .dest::before { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); z-index: 2; pointer-events: none; }
.board .dest.cap::before { width: 86%; height: 86%; background: none; box-shadow: inset 0 0 0 5px var(--dot); }
.board .pc { position: relative; z-index: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", sans-serif; pointer-events: none; }
.board .pw { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 1px 1px #000; }
.board .pb { color: #111; text-shadow: 0 0 1px #fff8; }
.board .co { position: absolute; font-size: 2.4cqi; font-weight: 700; font-family: var(--f-body); pointer-events: none; z-index: 1; }
.board .co.f { right: 6%; bottom: 3%; } .board .co.r { left: 6%; top: 3%; }
.board .l .co { color: var(--sq-dark); } .board .d .co { color: var(--sq-light); }
/* Choix de la promotion : par-dessus l'échiquier, rien ne bouge autour. */
.promo { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; background: rgba(0, 0, 0, .45); border-radius: 6px; color: #fff; font-weight: 700; }
.promo div { display: flex; gap: 8px; }
.promo button { font: inherit; font-size: 32px; line-height: 1; width: 56px; height: 56px; border-radius: 10px; border: 0; background: var(--sq-light); cursor: pointer; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", sans-serif; }
/* Verdict posé sur le coin de l'échiquier */
.verdict { position: absolute; top: -10px; right: -8px; z-index: 5; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 700; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3); pointer-events: none; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.verdict.ok { background: var(--ok); } .verdict.ko { background: var(--bad); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .verdict { animation: none; } }

/* Zone du verdict : seule partie qui défile si le texte est long. */
.scroll { order: 3; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; }
.nudge { font-size: 14px; font-weight: 700; color: var(--bad); }
.ctx, .state { color: var(--muted); font-size: 14px; }
.fb { border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.fb.ok { background: var(--ok-soft); border-color: transparent; }
.fb.ko { background: var(--bad-soft); border-color: transparent; }
.fb .v { font-weight: 700; font-size: 16px; }
.fb.ok .v { color: var(--ok); } .fb.ko .v { color: var(--bad); }
.fb p b { color: var(--muted); font-weight: 400; }
.links { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; }
.actions { order: 4; display: flex; gap: 8px; }
.btn { font: inherit; font-size: 15px; border-radius: 10px; padding: 8px 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-height: 46px;
  flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
.btn[disabled] { display: none; }
.empty { margin: auto; max-width: 440px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 24px 0; }
.empty .btn { flex: none; padding: 8px 18px; }

@media (min-aspect-ratio: 6/5) and (min-width: 640px) {
  .app { padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
  .stage { flex-direction: row; justify-content: center; gap: 24px; padding-bottom: 14px; --b: max(160px, min(100cqh, 100cqw - 344px, 760px)); }
  .board-col { order: 0; align-self: flex-start; }
  .panel { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; max-width: 460px; height: var(--b); }
  .bar, .ex-head, .scroll, .actions { max-width: none; align-self: auto; }
  .ex-head { align-items: flex-start; }
  .ex-head .sw { margin-top: 4px; }
  .ttl { flex-direction: column; gap: 2px; }
  .ttl b { font-size: 22px; }
  .ttl span { font-size: 15px; }
  .fb { padding: 12px 14px; }
  .verdict { width: 52px; height: 52px; font-size: 30px; top: -14px; right: -14px; }
}
/* Très peu de hauteur (téléphone couché, clavier) : on laisse défiler plutôt que d'écraser l'échiquier. */
@media (max-height: 380px) and (max-aspect-ratio: 6/5) {
  .app { height: auto; min-height: 100dvh; }
  .stage { container-type: inline-size; --b: min(100cqw, 300px); }
  .scroll { overflow: visible; }
}

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 20px; max-width: min(560px, calc(100vw - 24px)); font-size: 15px; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h2 { font-size: 20px; margin-bottom: 10px; }
dialog ul { margin: 0 0 12px; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
dialog .note { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
dialog .btn { flex: none; padding: 8px 18px; }
</style>
<script>
// Avant le premier affichage : dans l'appli (iframe) ou page autonome, et thème choisi.
(() => {
  const r = document.documentElement;
  try { if (window.parent !== window && window.parent.chessApp) r.classList.add("in-app"); } catch (e) {}
  try { const t = localStorage.getItem("theme"); if (t === "clair") r.dataset.theme = "light"; else if (t === "sombre") r.dataset.theme = "dark"; } catch (e) {}
})();
</script>

<div class="app">
  <header class="top">
    <h1 id="title"></h1>
    <button class="pill" id="themeBtn" type="button">Thème : auto</button>
  </header>

  <div class="bar">
    <div class="prog" id="prog" role="group" aria-label="Progression">
      <b id="pDone"></b><span class="lbl" id="pDoneLbl">faits</span>
      <div class="pbar" id="pBar"></div>
    </div>
    <details class="filters" id="filters">
      <summary class="pill"><span class="fsum" id="fSum"></span></summary>
      <div class="fbody">
        <div class="fgroup"><span class="eyebrow">Statut</span><div class="seg" id="fStatus" role="group" aria-label="Statut"></div></div>
        <div class="fgroup"><span class="eyebrow">Thème</span><div class="seg" id="fTheme" role="group" aria-label="Thème"></div></div>
        <div class="fgroup" id="gTc"><span class="eyebrow">Cadence</span><div class="seg" id="fTc" role="group" aria-label="Cadence"></div></div>
      </div>
    </details>
    <button class="pill" id="bHelp" type="button" aria-label="Comment ça marche">?</button>
  </div>
  <p class="sync" id="sync" role="status" hidden></p>

  <section class="stage" id="ex">
    <div class="board-col">
      <div class="board" id="board" role="grid" aria-label="Échiquier"></div>
      <div class="verdict" id="verdict" aria-hidden="true" hidden></div>
      <div class="promo" id="promo" hidden></div>
    </div>
    <div class="panel">
      <div class="ex-head">
        <span class="sw" id="sw"></span>
        <div class="ttl"><b id="theme"></b><span id="turnTxt"></span></div>
        <span class="counter num" id="counter"></span>
      </div>
      <div class="scroll" id="scroll">
        <p class="nudge" id="nudge" role="status" aria-live="polite" hidden></p>
        <div class="fb" id="fb" aria-live="polite" hidden></div>
        <div class="links" id="links" hidden></div>
        <p class="state" id="state"></p>

        <button class="btn" id="bErr" type="button" hidden>Voir mon erreur</button>
        <button class="btn" id="bNext" type="button">Passer</button>

    </div>
  </section>
  <div class="empty" id="empty" hidden></div>
</div>

<dialog id="help">
  <h2>Comment ça marche</h2>
  <ul id="helpList"></ul>
  <p class="note" id="helpNote"></p>
  <form method="dialog"><button class="btn primary" type="submit">Compris</button></form>
</dialog>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => `${Math.round(x)} %`;
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const dateLabel = d => { const [y, m, j] = d.split("-"); return `${+j} ${MOIS[+m - 1]} ${y}`; };
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const FILES = "abcdefgh";
const APP = (() => { try { return window.parent !== window ? window.parent.chessApp : null; } catch (e) { return null; } })();

// ---------- Titre et aide ----------
$("title").textContent = `${D.player} · Exercices`;
document.title = `Exercices ${D.player}`;
const sinceD = new Date(D.since);
$("helpList").innerHTML = [
  `${D.items.length} positions tirées de tes parties depuis ${MOIS[sinceD.getMonth()]} ${sinceD.getFullYear()}, là où tu as fait une erreur ou une gaffe. À toi de trouver mieux.`,
  "Touche une pièce, puis sa case d'arrivée.",
  `Un coup est accepté s'il perd moins de ${D.tolerance} points de % de gain par rapport au meilleur coup de Stockfish 19 (profondeur ${D.depth}).`,
  `« ${esc(D.themes.mate)} » : il faut un mat aussi rapide (un coup de plus toléré à partir du mat en 3). L'adversaire répond par sa meilleure défense et tu continues jusqu'au mat.`,
  "Réussi = du premier coup, sans indice ni solution. Sinon l'exercice passe dans « À revoir ».",
].map(t => `<li>${t}</li>`).join("");
$("bHelp").addEventListener("click", () => $("help").showModal());
$("help").addEventListener("click", e => { if (e.target === $("help")) $("help").close(); });

// ---------- Thème (hors appli : dans l'appli, il se règle dans le menu du compte) ----------
const THEMES = ["auto", "clair", "sombre"];
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
function applyTheme() {
  const r = document.documentElement;
  if (theme === "clair") r.setAttribute("data-theme", "light");
  else if (theme === "sombre") r.setAttribute("data-theme", "dark");
  else r.removeAttribute("data-theme");
  $("themeBtn").textContent = "Thème : " + theme;
}
$("themeBtn").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem("theme", theme); } catch (e) {}
  applyTheme();
});
if (theme !== "auto") applyTheme();

// ---------- Progression : db du viewer, copie locale en secours ----------
// progress[id] = { s: "ok" | "ko", a: nombre de tentatives, t: date ISO }
const LS_KEY = "exercises-progress";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) {}
let remote = null, writing = false, dirty = false;

// L'état normal (synchronisé) ne prend pas de place : il est rappelé dans l'aide. Seuls les soucis s'affichent.
function setSync(txt, warn) {
  $("sync").textContent = txt; $("sync").hidden = !warn;
  $("helpNote").textContent = `${txt}${/[.!?]$/.test(txt) ? "" : "."} Données du ${D.generated.replace(" ", " à ")}, issues de l'API publique chess.com (site non affilié à chess.com).`
    + (D.more ? " D'autres exercices sont en préparation : ils apparaîtront dans une minute environ." : "");
}
setSync("Chargement de ta progression…");
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {} }

let retryT = null;
async function flush() {
  if (!remote || writing || !dirty) return;
  writing = true; dirty = false;
  let failed = false;
  try {
    await remote.set({ p: progress, v: 1 });
    setSync("Progression synchronisée en ligne");
  } catch (e) {
    failed = true;
    if (e && ["invalid_argument", "invalid-argument", "permission-denied", "not_granted", "revoked"].includes(e.code)) {
      remote = null;
      setSync("Ta progression est gardée sur cet appareil seulement (pas d'accès en écriture à cette page).", true);
    } else {
      dirty = true;
      setSync("Synchronisation impossible pour l'instant, nouvel essai au prochain exercice.", true);
    }
  } finally { writing = false; }
  // Coups joués pendant l'écriture : on enchaîne. Après une erreur : nouvel essai dans 5 s,
  // jamais en boucle immédiate (une erreur synchrone gelait la page).
  if (dirty && remote && !failed) flush();
  else if (dirty && remote && !retryT) retryT = setTimeout(() => { retryT = null; flush(); }, 5000);
}
function record(id, ok) {
  const cur = progress[id] || { a: 0 };
  progress[id] = { s: ok ? "ok" : "ko", a: cur.a + 1, t: new Date().toISOString().slice(0, 10) };
  saveLocal(); dirty = true; setTimeout(flush, 0); renderProgress();
}

// Document de progression : celui du compte Google dans l'appli Firebase (page affichée
// dans son iframe), sinon celui du viewer sur claude.ai.
async function progressRef() {
  if (APP?.progressDoc) return APP.progressDoc();
  if (!window.claude?.use) return null;

(async () => {

    if (first) {

      const localOnly = Object.keys(progress).filter(k => !(k in p));

// ---------- Filtres ----------
const tcs = [...new Set(D.items.map(x => x.tc))];

// Filtre de départ (bouton « S'entraîner » d'un bilan) : transmis par l'appli, ou dans l'adresse #th=…&tc=…
(() => {
  let f = null;

  if (!f && location.hash.includes("th=")) f = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if (f?.th && (f.th === "all" || f.th in D.themes)) filt.th = f.th;
  if (f?.tc && tcs.includes(f.tc)) filt.tc = f.tc;
})();
function matches(x, f) {

// Chaque choix affiche le nombre d'exercices qu'il donnerait, les autres filtres restant en place.

    + `<i>${D.items.filter(x => matches(x, { ...filt, [key]: v })).length}</i></button>`).join("");

}
function renderFilters() {

  if (tcs.length > 1) seg("fTc", "tc", [["all", "Toutes cadences"], ...tcs.map(t => [t, D.tcLabels[t]])]);

// Panneau des filtres : se referme en touchant ailleurs ou avec Échap.
document.addEventListener("pointerdown", e => { if ($("filters").open && !$("filters").contains(e.target)) $("filters").open = false; });

function renderProgress() {
  const list = D.items.filter(x => inFilter(x, true));

// ---------- Position ----------
// pos : tableau de 64 cases (0 = a1), lettres FEN ou null.
function parseFen(fen) {
  const pos = Array(64).fill(null);
  fen.split(" ")[0].split("/").forEach((row, i) => {
    let f = 0;
    for (const ch of row) { if (/\d/.test(ch)) f += +ch; else pos[(7 - i) * 8 + f++] = ch; }
  });
  return pos;
}
const sqIdx = s => FILES.indexOf(s[0]) + (s[1] - 1) * 8;
const sqName = i => FILES[i % 8] + (Math.floor(i / 8) + 1);
function applyUci(pos, uci) {
  const p = pos.slice(), from = sqIdx(uci.slice(0, 2)), to = sqIdx(uci.slice(2, 4)), pc = p[from];
  const white = pc === pc.toUpperCase();
  if (pc.toLowerCase() === "k" && Math.abs(to - from) === 2) {
    const [rf, rt] = to > from ? [from + 3, from + 1] : [from - 4, from - 1];
    p[rt] = p[rf]; p[rf] = null;
  }
  if (pc.toLowerCase() === "p" && (to - from) % 8 !== 0 && !p[to]) p[to + (white ? -8 : 8)] = null;
  p[to] = uci[4] ? (white ? uci[4].toUpperCase() : uci[4]) : pc;
  p[from] = null;
  return p;
}

// ---------- Exercice courant ----------
let order = [], idx = -1;
let cur = {};   // { x, pos, sel, last, marks, done, tried, assisted, locked }

function goFirst() {
  order = D.items.filter(x => inFilter(x));
  renderFilters(); renderProgress();
  load(0);
}
function load(i) {
  $("promo").hidden = true;
  if (!order.length) {
    $("ex").hidden = true; $("empty").hidden = false;
    const n = st => D.items.filter(x => matches(x, { ...filt, st })).length;
    const [todo, ko, all] = [n("todo"), n("ko"), n("all")];
    // Plutôt qu'un cul-de-sac : les suites possibles, la plus utile en premier.
    const outs = [
      ...(filt.st !== "ko" && ko ? [["ko", ko > 1 ? `Retravailler mes ${ko} ratés` : "Retravailler mon raté"]] : []),
      ...(filt.st !== "todo" && todo ? [["todo", `Continuer : ${todo} à faire`]] : []),
      ...(filt.st !== "all" && all && !todo ? [["all", `Tout refaire (${all})`]] : []),
      ...(filt.th !== "all" || filt.tc !== "all" ? [["reset", "Voir tous les thèmes"]] : []),
    ];
    $("empty").innerHTML = `<p>${filt.st === "ko" ? "Rien à revoir dans cette sélection."
        : filt.st === "todo" && all ? "Bravo, tous les exercices de cette sélection sont faits."
        : "Aucun exercice dans cette sélection."}</p>`
      + outs.map(([st, label], k) => `<button class="btn${k ? "" : " primary"}" type="button" data-st="${st}">${label}</button>`).join("");
    return;
  }
  $("ex").hidden = false; $("empty").hidden = true;
  idx = (i + order.length) % order.length;
  const x = order[idx];
  // node : position où c'est au joueur de trouver le coup (racine, puis après chaque réponse de l'adversaire
  // dans une ligne de mat). nodePos / nodeLast : de quoi revenir au début de ce coup.
  const root = { mv: x.mv, b: x.b, nx: x.nx, chk: x.chk };
  cur = { x, root, node: root, nodePos: parseFen(x.fen), nodeLast: null, fresh: true, seq: [],
          pos: parseFen(x.fen), sel: null, last: null, marks: {}, done: false, tried: false, assisted: false, locked: false };
  const white = x.c === "w", g = D.themes[x.th];
  $("theme").textContent = x.th === "mate" ? `${g} en ${x.mv[0][5]}` : g;
  $("sw").style.background = white ? "#fff" : "#111";
  $("turnTxt").textContent = `Tu as les ${white ? "blancs" : "noirs"}` + (x.chk ? ", ton roi est en échec" : "");
  $("ctx").textContent = x.rep
    ? `${x.rep.name ? x.rep.name + " : " : ""}${x.rep.path || "position de départ"}. Tu as joué ${x.ps} ici ${x.rep.n} fois, `
      + `en perdant en moyenne ${String(x.rep.l).replace(".", ",")} points de % de gain. Dernière fois : contre ${x.o} (${x.oe}), ${dateLabel(x.d)} · ${D.tcLabels[x.tc]}.`
    : `Coup ${x.n} contre ${x.o} (${x.oe}), ${dateLabel(x.d)} · ${D.tcLabels[x.tc]}. `
    + `Avant ton coup, tu avais ${pct(x.wb)} de gain.`;
  $("counter").textContent = `${idx + 1} / ${order.length}`;
  $("counter").title = `Exercice ${idx + 1} sur ${order.length} dans cette sélection`;
  $("board").setAttribute("aria-label", `Échiquier vu des ${white ? "blancs" : "noirs"}`);
  $("fb").hidden = true; $("links").hidden = true; $("bRetry").hidden = true; $("nudge").hidden = true;
  $("bErr").hidden = true; $("bErr").textContent = "Voir mon erreur";
  $("bHint").disabled = false; $("bSol").disabled = false; $("verdict").hidden = true;
  $("bNext").textContent = "Passer"; $("bNext").classList.remove("primary");

}
$("empty").addEventListener("click", e => {
  const b = e.target.closest("button[data-st]"); if (!b) return;
  if (b.dataset.st === "reset") Object.assign(filt, { th: "all", tc: "all", st: "todo" });
  else filt.st = b.dataset.st;
  goFirst();
});
function renderState() {
  const p = progress[cur.x?.id];
  $("state").textContent = !p ? "" : p.s === "ok" ? `Déjà réussi le ${dateLabel(p.t)}.` : `Raté le ${dateLabel(p.t)} : à toi de le réussir du premier coup.`;
  $("state").hidden = !p;
}

function legalFrom(sq) { return cur.node.mv.filter(m => m[0].slice(0, 2) === sq); }
function drawBoard() {
  const x = cur.x, flip = x.c === "b";
  const dests = cur.sel ? legalFrom(cur.sel).map(m => m[0].slice(2, 4)) : [];
  const cells = [];
  for (let r = 7; r >= 0; r--) for (let f = 0; f < 8; f++) cells.push(r * 8 + f);
  if (flip) cells.reverse();
  const mine = ch => ch && (ch === ch.toUpperCase()) === (x.c === "w");
  const html = cells.map((i, k) => {
    const n = sqName(i), pc = cur.pos[i];
    const cls = [(Math.floor(i / 8) + i % 8) % 2 ? "l" : "d"];
    if (cur.marks[n]) cls.push(cur.marks[n]);
    else if (cur.last && cur.last.includes(n)) cls.push("last");
    if (cur.sel === n) cls.push("sel");
    if (cur.node.chk && cur.fresh && !cur.done && pc === (x.c === "w" ? "K" : "k")) cls.push("check");
    if (cur.flash === n) cls.push("flash");
    if (dests.includes(n)) cls.push("dest", ...(pc ? ["cap"] : []));
    const can = !cur.locked && !cur.done && (mine(pc) || dests.includes(n));
    if (can) cls.push("can");
    const glyph = pc ? `<span class="pc ${pc === pc.toUpperCase() ? "pw" : "pb"}">${GLYPH[pc.toLowerCase()]}︎</span>` : "";
    const co = (k % 8 === 0 ? `<span class="co r">${n[1]}</span>` : "") + (k >= 56 ? `<span class="co f">${n[0]}</span>` : "");
    const label = pc ? `${n}, ${pc === pc.toUpperCase() ? "blanc" : "noir"} ${{ k: "roi", q: "dame", r: "tour", b: "fou", n: "cavalier", p: "pion" }[pc.toLowerCase()]}` : n;
    return [n, cls.join(" "), label, co + glyph];
  });
  // On ne touche qu'aux cases qui changent : reconstruire les 64 cases à chaque toucher se sent sur mobile.
  const B = $("board"), key = cells.join();
  if (B.dataset.cells !== key) {
    B.dataset.cells = key;
    B.innerHTML = html.map(([n]) => `<button type="button" data-sq="${n}"></button>`).join("");
  }
  html.forEach(([, cls, label, inner], k) => {
    const el = B.children[k];
    if (el.className !== cls) el.className = cls;
    if (el.__inner !== inner) { el.innerHTML = inner; el.__inner = inner; el.setAttribute("aria-label", label); }
  });
}

// Réaction dès que le doigt (ou la souris) touche la case : le « click » arrive plus tard sur mobile.
// Le click reste utilisé pour le clavier (Entrée / Espace, e.detail === 0).
$("board").addEventListener("pointerdown", e => {
  if (e.button !== 0 || !e.isPrimary) return;
  e.preventDefault();
  tapSquare(e);
});
$("board").addEventListener("click", e => { if (e.detail === 0) tapSquare(e); });
function tapSquare(e) {
  const b = e.target.closest("button[data-sq]");
  if (!b || cur.done || cur.locked) return;
  const n = b.dataset.sq, pc = cur.pos[sqIdx(n)];
  const mine = pc && (pc === pc.toUpperCase()) === (cur.x.c === "w");
  if (cur.sel) {
    const cands = legalFrom(cur.sel).filter(m => m[0].slice(2, 4) === n);
    if (cands.length === 1) return play(cands[0]);
    if (cands.length > 1) return askPromo(cands);
  }
  if (mine && !legalFrom(n).length) return blocked(n);
  cur.sel = mine && cur.sel !== n ? n : null;
  $("promo").hidden = true; $("nudge").hidden = true;
  drawBoard();
}

// Pièce sans coup légal : on dit pourquoi au lieu de ne rien faire.
function blocked(n) {
  const c = cur, king = sqName(cur.pos.indexOf(cur.x.c === "w" ? "K" : "k"));
  const inCheck = cur.node.chk && cur.fresh;
  cur.sel = null;
  cur.flash = inCheck ? king : n;
  nudge(!inCheck ? "Cette pièce ne peut pas bouger : elle est clouée ou bloquée."
    : n === king ? "Ton roi est en échec et n'a aucune case libre : interpose une pièce ou prends l'attaquant."
    : "Ton roi est en échec : cette pièce ne peut ni s'interposer ni prendre l'attaquant.");
  drawBoard();
  clearTimeout(c.flashT);
  c.flashT = setTimeout(() => { if (cur === c) { c.flash = null; drawBoard(); } }, 1400);
}
function nudge(t) { $("nudge").textContent = t; $("nudge").hidden = false; $("scroll").scrollTop = 0; }

function askPromo(cands) {
  const white = cur.x.c === "w";
  $("promo").innerHTML = `<span>Promotion en…</span><div>` + ["q", "r", "b", "n"].map(p => {
    const m = cands.find(c => c[0][4] === p);
    return m ? `<button type="button" data-u="${m[0]}" aria-label="${{ q: "dame", r: "tour", b: "fou", n: "cavalier" }[p]}" style="color:${white ? "#fff" : "#111"};text-shadow:0 0 1px #000,0 0 1px #000">${GLYPH[p]}︎</button>` : "";
  }).join("") + "</div>";
  $("promo").hidden = false;
  $("promo").onclick = e => {
    const b = e.target.closest("button[data-u]");
    $("promo").hidden = true;
    if (b) play(cands.find(c => c[0] === b.dataset.u));
    else { cur.sel = null; drawBoard(); }       // toucher à côté : on annule
  };
}

const best = () => cur.node.mv[0];
function accepted(m) {
  const b = best();
  // Ligne de mat : budget de coups calculé à la génération (racine : un coup de plus toléré dès le mat en 3).
  if (cur.x.th === "mate" && cur.node.b) return m[5] > 0 && m[5] <= cur.node.b;
  // Mat : un mat aussi rapide (ou d'un coup plus long pour les mats en 3 et plus).
  return cur.x.th === "mate" ? m[5] > 0 && m[5] <= b[5] + (b[5] >= 3 ? 1 : 0) : m[2] >= b[2] - D.tolerance;
}

function setVerdict(ok) {
  $("verdict").className = "verdict " + (ok ? "ok" : "ko"); $("verdict").textContent = ok ? "✓" : "✗"; $("verdict").hidden = false;
}
function showFb(cls, html) {
  $("fb").className = "fb" + (cls ? " " + cls : ""); $("fb").innerHTML = html; $("fb").hidden = false;
  $("scroll").scrollTop = 0;
}
function play(m) {
  const x = cur.x, node = cur.node, ok = accepted(m), clean = !cur.tried && !cur.assisted;
  cur.sel = null; cur.fresh = false; $("nudge").hidden = true;
  cur.pos = applyUci(cur.pos, m[0]);

    cur.tried = true; cur.locked = true;
    cur.marks = { [m[0].slice(2, 4)]: "bad" };
    drawBoard();
    showFeedback(false, `${m[1]} n'est pas le bon coup.`, m);
    if (m[3]) setTimeout(() => {
      if (cur.node !== node || !cur.locked) return;
      cur.pos = applyUci(cur.pos, m[3]);
      cur.last = [m[3].slice(0, 2), m[3].slice(2, 4)];
      cur.marks = {};
      drawBoard();
    }, 650);
    $("bRetry").hidden = false;
    return;
  }
  cur.seq.push(m[1]);
  const child = node.nx?.[m[0]];
  if (!child) {
    // Fin de l'exercice (mat donné, ou exercice en un coup).
    if (clean) record(x.id, true);
    cur.done = true;
    if (cur.seq.length > 1) $("turnTxt").textContent = "Échec et mat !";
    drawBoard();
    const isBest = m[0] === best()[0] || m[2] >= best()[2] - 2;
    showFeedback(true, cur.seq.length > 1 ? `Mat en ${Math.ceil(cur.seq.length / 2)} trouvé !`
      : isBest ? `${m[1]} : c'est le meilleur coup.` : `${m[1]} : bon coup, accepté.`, m);
    return;
  }
  // Ligne de mat : l'adversaire répond, et c'est de nouveau au joueur.
  cur.locked = true; cur.busy = true;
  drawBoard();
  const left = child.mv[0][5];
  showFb("ok", `<div class="v">${esc(m[1])} : bien joué !</div><p>L'adversaire répond <span class="mono">${esc(child.rs)}</span>. `
    + `Continue : il reste un mat en ${left}.</p>`);
  $("bRetry").hidden = true;
  setTimeout(() => {
    if (cur.node !== node) return;
    cur.pos = applyUci(cur.pos, child.r);
    cur.last = [child.r.slice(0, 2), child.r.slice(2, 4)];
    cur.seq.push(child.rs);
    Object.assign(cur, { node: child, nodePos: cur.pos, nodeLast: cur.last, fresh: true, locked: false, busy: false });
    $("verdict").hidden = true;
    $("turnTxt").textContent = (child.chk ? "Ton roi est en échec : " : "À toi : ") + `mat en ${left}`;
    drawBoard();

}

// Coups de la ligne : ceux du joueur en gras, les réponses en plus discret.
const seqHtml = seq => seq.map((s, i) => i % 2 ? `<span class="muted">${esc(s)}</span>` : `<span class="mono">${esc(s)}</span>`).join(" ");
const rowsHtml = lines => lines.map(([t, d]) => `<p><b>${t} :</b> ${d}</p>`).join("");

function showFeedback(ok, verdict, m) {
  const x = cur.x, b = best();
  const lines = [];
  if (ok) {
    if (cur.seq.length > 1) lines.push(["Ta combinaison", seqHtml(cur.seq)]);
    else {
      const others = cur.node.mv.filter(o => o[0] !== m[0] && accepted(o)).slice(0, 4);
      lines.push(["Ton coup", `<span class="mono">${esc(m[1])}</span> · ${pct(m[2])} de gain`]);
      if (m[0] !== b[0]) lines.push(["Meilleur coup", `<span class="mono">${esc(b[1])}</span> · ${pct(b[2])}`]);
      if (others.length) lines.push(["Aussi accepté" + (others.length > 1 ? "s" : ""), others.map(o => `<span class="mono">${esc(o[1])}</span>`).join(", ")]);
    }
    lines.push(["Dans la partie", `tu as joué <span class="mono">${esc(x.ps)}</span>${partieTail()}`]);
  } else {
    const reply = m[4] ? `L'adversaire répond <span class="mono">${esc(m[4])}</span> et ` : "Après ce coup, ";
    lines.push(["Pourquoi", `${reply}tu tombes à ${pct(m[2])} de gain (contre ${pct(b[2])} avec le meilleur coup).`]);
    if (m[0] === x.pu && cur.node === cur.root) lines.push(["Dans la partie", "c'est exactement le coup que tu avais joué."]);
  }

}
function partieTail() {
  const p = cur.x.mv.find(o => o[0] === cur.x.pu);
  return p ? ` (${pct(cur.x.wb)} → ${pct(p[2])} de gain)` + (p[4] ? `, puni par <span class="mono">${esc(p[4])}</span>` : "") : "";
}
function finish() {
  cur.done = true;
  $("bHint").disabled = true; $("bSol").disabled = true; $("bRetry").hidden = true;
  $("bNext").textContent = "Suivant →"; $("bNext").classList.add("primary");
  const x = cur.x;
  const lichess = "https://lichess.org/analysis/" + x.fen.replace(/ /g, "_") + "?color=" + (x.c === "b" ? "black" : "white");
  $("links").innerHTML = (APP?.openGame ? `<a href="#" id="lReplay">Rejouer la partie</a>` : "")
    + `<a href="${lichess}" target="_blank" rel="noopener">Analyser sur Lichess ↗</a>`
    + `<a href="${esc(x.u)}" target="_blank" rel="noopener">chess.com ↗</a>`;
  $("lReplay")?.addEventListener("click", e => {
    e.preventDefault();
    const k = x.id.lastIndexOf("-");
    APP.openGame(x.id.slice(0, k), +x.id.slice(k + 1));
  });
  $("links").hidden = false;
  $("bErr").hidden = !x.mv.some(o => o[0] === x.pu);
  renderState();
}

// Après la bonne réponse : rejouer sur l'échiquier le coup de la partie et la réponse qui le punit.
$("bErr").addEventListener("click", () => {
  const c = cur, x = c.x;

    Object.assign(c, c.saved); c.saved = null;
    $("bErr").textContent = "Voir mon erreur";
    return drawBoard();
  }
  const p = x.mv.find(o => o[0] === x.pu);
  if (!p) return;
  c.saved = { pos: c.pos, last: c.last, marks: c.marks };
  c.pos = applyUci(parseFen(x.fen), x.pu);
  c.last = null;
  c.marks = { [x.pu.slice(0, 2)]: "bad", [x.pu.slice(2, 4)]: "bad" };
  $("bErr").textContent = "Voir la solution";
  drawBoard();
  if (p[3]) setTimeout(() => {
    if (cur !== c || !c.saved) return;
    c.pos = applyUci(c.pos, p[3]);
    c.marks = { [x.pu.slice(2, 4)]: "bad" };
    c.last = [p[3].slice(0, 2), p[3].slice(2, 4)];
    drawBoard();
  }, 700);
});

$("bRetry").addEventListener("click", () => {
  cur.pos = cur.nodePos; cur.last = cur.nodeLast; cur.marks = {}; cur.locked = false; cur.sel = null; cur.fresh = true;
  $("fb").hidden = true; $("bRetry").hidden = true; $("verdict").hidden = true;
  drawBoard();
});
$("bHint").addEventListener("click", () => {
  if (cur.done || cur.busy) return;
  if (!cur.tried && !cur.assisted) record(cur.x.id, false);
  cur.assisted = true;
  if (cur.locked) { $("bRetry").click(); }
  cur.marks = { [best()[0].slice(0, 2)]: "hint" };
  drawBoard();
  const hints = { mate: "Cherche un échec qui ne laisse aucune case au roi.", tactic: "Un seul coup gagne vraiment : regarde les captures et les échecs.", safe: "Plusieurs coups conviennent : vérifie qu'aucune pièce ne reste en prise après ton coup.",
    opening: "Développe une pièce ou tiens le centre, sans rien laisser en prise." };
  showFb("", `<div class="v">Indice</div><p>La pièce à jouer est encadrée. ${hints[cur.x.th] || ""}</p>`);
});
$("bSol").addEventListener("click", () => {
  if (cur.done || cur.busy) return;
  if (!cur.tried && !cur.assisted) record(cur.x.id, false);
  cur.assisted = true;
  // On rejoue la fin de la ligne depuis le coup en cours : meilleur coup, réponse, meilleur coup… jusqu'au mat.
  const c = cur, start = c.node, plies = [];
  for (let n = start; n; ) {
    const b = n.mv[0], child = n.nx?.[b[0]];
    plies.push([b[0], b[1]]);
    if (child) plies.push([child.r, child.rs]);
    n = child;
  }
  const b = start.mv[0];
  c.pos = c.nodePos; c.last = c.nodeLast; c.locked = false; c.sel = null; c.fresh = false; c.done = true;
  $("verdict").hidden = true;
  const step = k => {
    if (cur !== c) return;
    const [u] = plies[k];
    c.pos = applyUci(c.pos, u);
    c.marks = k % 2 ? {} : { [u.slice(0, 2)]: "best", [u.slice(2, 4)]: "best" };
    c.last = k % 2 ? [u.slice(0, 2), u.slice(2, 4)] : null;
    drawBoard();
    if (k + 1 < plies.length) setTimeout(() => step(k + 1), 800);
  };
  step(0);
  const others = start.mv.filter(o => o[0] !== b[0] && accepted(o)).slice(0, 4);
  showFb("", (plies.length > 1
      ? `<div class="v">Solution : ${seqHtml(plies.map(p => p[1]))}</div>`
      : `<div class="v">Solution : <span class="mono">${esc(b[1])}</span> (${pct(b[2])} de gain)</div>`)
    + rowsHtml([...(others.length ? [[`Aussi accepté${others.length > 1 ? "s" : ""}`, others.map(o => `<span class="mono">${esc(o[1])}</span>`).join(", ")]] : []),
        ["Dans la partie", `tu as joué <span class="mono">${esc(cur.x.ps)}</span>${partieTail()}`]]));
  finish();
});
function next() {
  // En « À faire » / « À revoir », la liste se recalcule : l'exercice traité en sort.
  const curId = cur.x?.id;
  const sel = D.items.filter(x => inFilter(x, true));
  const at = sel.findIndex(x => x.id === curId);
  let nextX = null;
  for (let k = 1; k <= sel.length && !nextX; k++) {
    const c = sel[(at + k) % sel.length];
    if (c.id !== curId && inFilter(c)) nextX = c;
  }
  order = D.items.filter(x => inFilter(x) && (x.id !== curId || !nextX));
  load(nextX ? order.indexOf(nextX) : 0);
}
$("bNext").addEventListener("click", next);
// Clavier : Entrée passe à l'exercice suivant une fois celui-ci terminé.
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !cur.done || $("help").open || e.target.closest?.("button, a, summary, input")) return;
  e.preventDefault(); next();
});

goFirst();
</script>
